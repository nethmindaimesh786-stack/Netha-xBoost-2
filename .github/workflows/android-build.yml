name: Build NETHA X ULTIMATE Native APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle Wrapper
        id: gradle
        shell: bash
        run: |
          WRAPPER=$(find . -type f -name gradlew -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew file not found in repository."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
          echo "Found Gradle wrapper: $WRAPPER"

      - name: Build Debug APK
        shell: bash
        run: |
          WRAPPER="${{ steps.gradle.outputs.wrapper }}"
          chmod +x "$WRAPPER"
          cd "$(dirname "$WRAPPER")"
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NETHA-X-ULTIMATE-DEBUG-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
