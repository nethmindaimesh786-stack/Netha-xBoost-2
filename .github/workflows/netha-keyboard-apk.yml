name: Build NETHA KEYBOARD ULTRA APK
on:
  workflow_dispatch:
  push:
    branches: [netha-keyboard-ultra]
    paths:
      - "keyboard-app/**"
      - ".github/workflows/netha-keyboard-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: keyboard-app
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NETHA-KEYBOARD-ULTRA-debug
          path: keyboard-app/app/build/outputs/apk/debug/app-debug.apk
